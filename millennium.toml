[plugin]
id = "steam-command-palette"
name = "Command Palette"
version = "0.7.0"
author = "NotAmiru"
description = "Ctrl+K palette: launch library games, jump to Steam pages, run actions, search the store."

[assets]
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix = "BCK"
frontend_prefix = "FRT"
